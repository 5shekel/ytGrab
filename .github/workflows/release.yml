name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish -c Release

      - name: Build MSI
        run: dotnet build Installer/YtGrab.Installer.wixproj -c Release

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: YtGrab-${{ github.ref_name }}
          path: |
            bin/Release/net8.0-windows/win-x64/publish/YtGrab.exe
            Installer/bin/Release/YtGrab.msi

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "bin/Release/net8.0-windows/win-x64/publish/YtGrab.exe"
          "Installer/bin/Release/YtGrab.msi"
          --title "${{ github.ref_name }}"
          --generate-notes
